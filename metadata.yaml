# Don't forget to surround abstract with double quotes
abstract: "Wang et al. (2024) report that large language models used as pairwise evaluators reverse their verdicts when the two candidate answers are swapped, and propose three calibration strategies, one of which this study replicates. We pre-registered a judge-substitution replication on three open-weight instruction-tuned models served locally. The registered protocol could not be executed: two of the three judges failed a pre-registered temperature-0 determinism control, which halted their temperature-0 arms as the registration required, and the third judge's output defeated the registered parser on 313 of 320 records. None of the three pre-registered hypotheses is therefore evaluable as registered. This is not an assertion that the original finding is false; it reports that a pre-registered protocol proved non-executable on these systems. We report the surviving temperature-1 arms descriptively, with every departure from the plan recorded in a dated register released with the article."

