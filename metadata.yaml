#
# NO TITLE PREFIX. The ReScience template's own metadata.yaml states the rule: "[Re]" for a
# successful replication, "[¬Re]" for a failed one, and "for other article types, no instruction".
# This replication is neither: its pre-registered protocol proved non-executable on the target
# systems, so none of the three registered hypotheses is evaluable as registered. [Re] would claim
# a reproduction that was never tested, and [¬Re] would have the journal declare the original
# non-replicable on no evidence. A question for the editors is drafted and awaiting the owner.

title: "Does positional bias in LLM-as-judge evaluation, and its calibration fix, hold for open-weight judges? A pre-registered replication halted by its own determinism control"

